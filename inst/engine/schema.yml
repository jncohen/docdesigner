# docdesigner style schema — the single source of truth.
#
# The validator reads this file. The AI brief is generated from this file. The
# renderer consults it for scale lookups. Nothing about the token vocabulary is
# written down anywhere else.
#
# Design rule: a style never writes a raw LaTeX dimension. Lengths are named
# steps on a scale, defined below. Numbers appear only where they are bounded
# and cannot produce invalid LaTeX. Hex colours appear only under `color:`;
# everywhere else a token names a colour *role*.
#
# status:
#   impl  implemented and rendering today
#   port  the LaTeX exists in docdesignertemplate.tex; needs wiring
#   new   requires new LaTeX; validates but is currently ignored
#   risk  feasible but fragile, especially with columns: 2

format_version: 2

# ---------------------------------------------------------------------------
# Scales. A token of type `scale:<name>` accepts exactly these keys.
# ---------------------------------------------------------------------------
scales:
  space:
    none: "0pt"
    xs:   "0.25em"
    sm:   "0.5em"
    md:   "1em"
    lg:   "1.75em"
    xl:   "2.5em"
  indent:
    none: "0pt"
    sm:   "0.75em"
    md:   "1em"
    lg:   "1.5em"
  rule_weight:
    hairline: "0.4pt"
    thin:     "0.6pt"
    medium:   "1pt"
    thick:    "2pt"
    heavy:    "3pt"
  gutter:
    sm: "1em"
    md: "1.5em"
    lg: "2.2em"
  margin:
    narrow: "0.75in"
    normal: "1in"
    wide:   "1.35in"
  width:
    half: "0.5\\linewidth"
    text: "0.85\\linewidth"
    full: "\\linewidth"

# Colour roles. `color.*` takes a hex value; every other colour token names one
# of these. `accent2`, `background`, `code_bg` may be null.
roles: [accent, accent2, text, muted, rule, background, code_bg, knockout]

# Font families the core package bundles. A style may add its own under
# `fonts:` and ship the files in assets/fonts/.
bundled_fonts: ["Source Serif 4", "EB Garamond", "XITS", "Fira Code"]

# Font families a style may name WITHOUT bundling. `typography.label` (and any
# other font token) may point at one of these: dd_preamble() loads them by name
# behind \IfFontExistsTF, so an absent face degrades to the body font rather
# than failing the build. Listed here so the validator does not report a
# deliberate system face as an unknown font, while still catching typos.
system_fonts: ["Arial", "Helvetica", "Helvetica Neue", "Times New Roman",
               "Georgia", "Verdana", "Tahoma", "Calibri", "Cambria",
               "Courier New", "Consolas", "Segoe UI"]

# Levels expanded wherever a token key contains <h>.
heading_levels: [h1, h2, h3, h4]

# ---------------------------------------------------------------------------
# Tokens. Flat dotted keys. `<h>` expands across heading_levels.
# ---------------------------------------------------------------------------
tokens:

  # -- identity --------------------------------------------------------------
  id:          {type: id,     required: true,  status: impl, doc: "Unique style id. Keys resolution, not the folder name."}
  label:       {type: string, required: true,  status: impl, doc: "Human-readable name."}
  description: {type: string, status: impl, doc: "One line. Note the original typefaces here if imitating a publication."}
  inherits:    {type: id,     status: impl, doc: "Style id to inherit from. Resolves a full chain, root-first."}

  # -- page ------------------------------------------------------------------
  page.papersize:   {type: enum, values: [letter, a4], default: letter, status: impl}
  page.margin:      {type: "scale:margin", default: normal, status: impl, doc: "Shorthand for all four sides."}
  page.margins.top:    {type: inches, min: 0.4, max: 2.0, status: impl, doc: "Overrides page.margin when set."}
  page.margins.bottom: {type: inches, min: 0.4, max: 2.0, status: impl}
  page.margins.inner:  {type: inches, min: 0.4, max: 2.0, status: impl, doc: "Binding edge when twoside; else left."}
  page.margins.outer:  {type: inches, min: 0.4, max: 2.0, status: impl}
  page.twoside:     {type: bool, default: false, status: impl, doc: "Mirror margins, alternate running heads."}
  page.columns:     {type: int, values: [1, 2], default: 1, status: impl}
  page.gutter:      {type: "scale:gutter", default: md, status: new}
  page.column_rule: {type: bool, default: false, status: new, doc: "Hairline between columns."}

  # -- typography ------------------------------------------------------------
  typography.body:        {type: font, default: "Source Serif 4", status: impl}
  typography.heading:     {type: font, default: "Source Serif 4", status: impl}
  typography.mono:        {type: font, default: "Fira Code", status: impl}
  typography.display:     {type: font, status: new, doc: "Title/masthead face. Falls back to heading."}
  typography.label:       {type: font, nullable: true, status: impl, doc: "Sans furniture face for kickers, callout titles, table headers. Loaded by name via \\IfFontExistsTF; falls back to body if the named font is absent."}
  typography.base_size:   {type: enum, values: ["8pt","8.5pt","9pt","9.5pt","10pt","10.5pt","11pt","11.5pt","12pt"], default: "10pt", status: impl}
  typography.line_height: {type: num, min: 1.0, max: 2.0, default: 1.30, status: impl}
  typography.mono_scale:  {type: num, min: 0.6, max: 1.0, default: 0.82, status: impl}
  typography.numbers:     {type: enum, values: [lining, oldstyle], default: lining, status: new}
  typography.justification: {type: enum, values: [justified, ragged-right], default: justified, status: new}
  typography.hyphenation: {type: bool, default: true, status: new}
  typography.microtype:   {type: bool, default: true, status: impl}

  # -- colour ----------------------------------------------------------------
  color.accent:     {type: hex, default: "333333", status: impl}
  color.accent2:    {type: hex, nullable: true, status: new}
  color.text:       {type: hex, default: "000000", status: impl}
  color.muted:      {type: hex, default: "5B6470", status: impl}
  color.rule:       {type: hex, default: "333333", status: impl}
  color.background: {type: hex, nullable: true, status: new}
  color.code_bg:    {type: hex, nullable: true, status: new}
  color.knockout:   {type: hex, default: "FFFFFF", status: new, doc: "Text drawn on an accent-filled bar."}

  # -- headings --------------------------------------------------------------
  headings.number_sections: {type: bool, default: false, status: impl}
  headings.numbering:       {type: enum, values: [arabic, roman, alpha, none], default: arabic, status: new}
  headings.run_in:          {type: list, values: [h2, h3, h4], status: new, doc: "Levels typeset run-in with the paragraph."}

  headings.<h>.family:       {type: enum, values: [body, heading, display, mono], default: heading, status: new}
  headings.<h>.scale:        {type: num, min: 0.5, max: 4.0, status: impl, doc: "Multiple of typography.base_size."}
  headings.<h>.weight:       {type: enum, values: [light, regular, bold], default: bold, status: impl}
  # Per-level defaults follow the <h> block and override it. Every level must
  # carry a `scale` default: dd_preamble() dereferences h1..h4 unconditionally,
  # and a style that declares only h1 and h2 must still resolve h3/h4.
  headings.<h>.style:        {type: enum, values: [normal, italic], default: normal, status: impl}
  headings.<h>.case:         {type: enum, values: [none, upper, lower, smallcaps], default: none, status: impl}
  headings.<h>.color:        {type: role, default: accent, status: impl}
  headings.<h>.align:        {type: enum, values: [left, center, right], default: left, status: impl}
  headings.<h>.space_before: {type: "scale:space", default: lg, status: impl}
  headings.<h>.space_after:  {type: "scale:space", default: sm, status: impl}
  headings.<h>.rule.position: {type: enum, values: [above, below, none], default: none, status: impl,
                               doc: "`above` is not yet rendered; it behaves as `below`."}
  headings.<h>.rule.weight:   {type: "scale:rule_weight", default: medium, status: impl}
  headings.<h>.rule.color:    {type: role, default: rule, status: impl}
  headings.<h>.rule.length:   {type: enum, values: [full, text], default: full, status: new}
  headings.<h>.bar.fill:      {type: role, status: new, doc: "Set to render the heading as a filled bar."}
  headings.<h>.bar.text:      {type: role, default: knockout, status: new}

  headings.h1.scale: {type: num, min: 0.5, max: 4.0, default: 1.35, status: impl}
  headings.h2.scale: {type: num, min: 0.5, max: 4.0, default: 1.15, status: impl}
  headings.h3.scale: {type: num, min: 0.5, max: 4.0, default: 1.00, status: impl}
  # dd_preamble() maps h1..h4 onto \section, \subsection, \subsubsection, \paragraph
  # (the last as a titlesec [runin] heading, never numbered).
  headings.h4.scale: {type: num, min: 0.5, max: 4.0, default: 1.00, status: impl}
  headings.h4.color: {type: role, default: accent, status: impl}
  headings.h4.case:  {type: enum, values: [none, upper, lower, smallcaps], default: none, status: impl}
  headings.h4.space_before: {type: "scale:space", default: md, status: impl}
  headings.h4.space_after:  {type: "scale:space", default: xs, status: impl}
  headings.h4.rule.position: {type: enum, values: [above, below, none], default: none, status: impl}
  headings.h4.rule.weight:   {type: "scale:rule_weight", default: medium, status: impl}
  headings.h4.rule.color:    {type: role, default: rule, status: impl}

  headings.h1.space_before: {type: "scale:space", default: lg, status: impl}
  headings.h2.space_before: {type: "scale:space", default: md, status: impl}
  headings.h3.space_before: {type: "scale:space", default: md, status: impl}
  headings.h1.space_after:  {type: "scale:space", default: sm, status: impl}
  headings.h2.space_after:  {type: "scale:space", default: xs, status: impl}
  headings.h3.space_after:  {type: "scale:space", default: xs, status: impl}

  headings.h4.weight: {type: enum, values: [light, regular, bold], default: regular, status: impl}
  headings.h4.style:  {type: enum, values: [normal, italic], default: italic, status: impl}

  # -- title -----------------------------------------------------------------
  title.layout: {type: enum, values: [plain, essay, journal, report, masthead], default: plain, status: port,
                 doc: "plain: flush left. essay: centred, book-like. journal: centred with rules, abstract, keywords. report: flush left, heavy rule, institution line. masthead: compact accent bar, one page."}
  title.align:  {type: enum, values: [left, center], default: left, status: impl}
  title.scale:  {type: num, min: 1.0, max: 5.0, default: 2.6, status: impl}
  title.color:  {type: role, default: text, status: impl, doc: "Near-black is what every design-sets mockup specifies; accent titles are the exception, not the rule."}
  title.family: {type: enum, values: [body, heading, display], default: heading, status: new}
  title.case:   {type: enum, values: [none, upper, smallcaps], default: none, status: new}
  title.rule.position: {type: enum, values: [above, below, both, none], default: none, status: impl,
                        doc: "Only `below` and `none` are rendered today; `above`/`both` behave as `below`."}
  title.rule.weight:   {type: "scale:rule_weight", default: thick, status: impl}
  title.rule.length: {type: inches, min: 0.3, max: 8.0, nullable: true, status: impl, doc: "Rule width in inches; omit for the full measure."}
  title.rule.color:    {type: role, default: rule, status: impl}
  title.page_break_after: {type: bool, default: false, status: new, doc: "true = a full title page."}

  # Kicker: a short eyebrow label set above the title (venue/section/series).
  title.kicker.text:  {type: string, nullable: true, status: impl, doc: "Eyebrow label above the title. Unset = no kicker."}
  title.kicker.color: {type: role, default: accent, status: impl}
  title.kicker.case:  {type: enum, values: [none, upper, lower, smallcaps], default: upper, status: impl}
  title.kicker.scale: {type: num, min: 0.5, max: 1.5, default: 0.8, status: impl, doc: "Multiple of typography.base_size."}
  title.kicker.font:  {type: enum, values: [label, heading, body], default: label, status: impl}

  title.subtitle.scale: {type: num, min: 0.8, max: 2.5, default: 1.3, status: impl}
  title.subtitle.style: {type: enum, values: [normal, italic], default: italic, status: impl}
  title.subtitle.color: {type: role, default: muted, status: impl}

  title.byline.position: {type: enum, values: [above, below], default: below, status: port}
  title.byline.case:     {type: enum, values: [none, upper, smallcaps], default: none, status: port}
  title.byline.color:    {type: role, default: muted, status: impl}

  title.date.show:  {type: bool, default: true, status: port}
  title.date.color: {type: role, default: muted, status: impl}

  title.abstract.width: {type: "scale:width", default: text, status: port}
  title.abstract.size:  {type: num, min: 0.7, max: 1.2, default: 0.95, status: impl}
  title.abstract.label: {type: string, default: "Abstract", status: impl}
  title.abstract.rule:  {type: bool, default: false, status: port}
  title.abstract.show:  {type: bool, default: true, status: impl,
                         doc: "false suppresses it entirely — a magazine feature has a deck, not an abstract."}
  title.abstract.label_style: {type: enum, values: [heading, runin, none], default: heading, status: impl,
                               doc: "heading: centred bold over the block. runin: small-caps label inline with the first line. none: no label."}
  title.abstract.indent: {type: "scale:indent", default: none, status: impl, doc: "Inset from BOTH margins."}
  title.abstract.weight: {type: enum, values: [regular, bold], default: regular, status: impl,
                          doc: "bold gives a standfirst rather than an abstract."}
  title.abstract.color:  {type: role, default: text, status: impl}
  title.abstract.box:         {type: bool, default: false, status: impl, doc: "Wrap the abstract in a filled/bordered panel."}
  title.abstract.background:  {type: role, nullable: true, status: impl, doc: "Panel fill when box is true; defaults to code_bg."}
  title.abstract.label_color: {type: role, default: text, status: impl}
  title.abstract.label_align: {type: enum, values: [left, center, right], default: center, status: impl}
  title.abstract.label_case:  {type: enum, values: [none, upper, smallcaps], default: none, status: impl}

  title.keywords.show:  {type: bool, default: true, status: port}
  title.keywords.label: {type: string, default: "Keywords", status: port}

  # -- paragraph -------------------------------------------------------------
  paragraph.indent:  {type: "scale:indent", default: none, status: impl}
  paragraph.spacing: {type: "scale:space",  default: sm,   status: impl}
  paragraph.indent_after_heading: {type: bool, default: false, status: new}
  paragraph.drop_cap.lines: {type: int, min: 2, max: 4, status: new, doc: "Set to enable a drop cap."}
  paragraph.drop_cap.color: {type: role, default: accent, status: risk, doc: "lettrine; unreliable under columns: 2."}

  # -- figure ----------------------------------------------------------------
  figure.style:         {type: enum, values: [plain, ruled, inset], default: plain, status: new}
  figure.width:         {type: "scale:width", default: full, status: new}
  figure.placement:     {type: enum, values: [here, top, bottom, page], default: top, status: new}
  figure.span_columns:  {type: bool, default: false, status: risk, doc: "figure* under columns: 2."}
  figure.caption.position:    {type: enum, values: [above, below], default: below, status: new}
  figure.caption.family:      {type: enum, values: [body, heading, mono], default: body, status: impl}
  figure.caption.size:        {type: num, min: 0.6, max: 1.0, default: 0.85, status: impl}
  figure.caption.align:       {type: enum, values: [left, center], default: left, status: impl}
  figure.caption.color:       {type: role, default: muted, status: impl}
  figure.caption.label_style: {type: enum, values: [bold, italic, smallcaps, none], default: bold, status: impl}

  # -- table -----------------------------------------------------------------
  table.style:       {type: enum, values: [booktabs, grid, zebra, minimal], default: booktabs, status: impl}
  table.row_stretch: {type: num, min: 1.0, max: 2.0, default: 1.2, status: impl}
  table.size:        {type: num, min: 0.7, max: 1.1, default: 0.9, status: new}
  table.zebra_color: {type: role, nullable: true, status: new}
  table.header.weight:     {type: enum, values: [regular, bold], default: bold, status: new}
  table.header.case:       {type: enum, values: [none, upper, smallcaps], default: none, status: new}
  table.header.rule_below: {type: bool, default: true, status: new}
  table.caption.position:  {type: enum, values: [above, below], default: above, status: new}

  # -- code ------------------------------------------------------------------
  code.highlight:    {type: enum, values: [pygments, tango, espresso, zenburn, kate, monochrome, breezedark, haddock, none], default: tango, status: impl}
  code.background:   {type: role, nullable: true, status: impl}
  code.border:       {type: bool, default: false, status: impl}
  code.line_numbers: {type: bool, default: false, status: new}

  # -- quote -----------------------------------------------------------------
  quote.indent: {type: "scale:indent", default: md, status: impl}
  quote.style:  {type: enum, values: [normal, italic], default: normal, status: impl}
  quote.color:  {type: role, default: text, status: impl}
  quote.rule:   {type: bool, default: false, status: impl, doc: "Vertical accent rule at the left."}

  # -- footnotes -------------------------------------------------------------
  footnotes.size:      {type: num, min: 0.6, max: 1.0, default: 0.8, status: new}
  footnotes.numbering: {type: enum, values: [arabic, symbol], default: arabic, status: new}

  # -- running heads ---------------------------------------------------------
  header_footer.header.left:   {type: enum, values: [none, title, runningtitle, author, surname, section, page], default: none, status: impl}
  header_footer.header.center: {type: enum, values: [none, title, runningtitle, author, surname, section, page], default: none, status: impl}
  header_footer.header.right:  {type: enum, values: [none, title, runningtitle, author, surname, section, page], default: none, status: impl}
  header_footer.header.rule:   {type: bool, default: false, status: impl}
  header_footer.footer.left:   {type: enum, values: [none, title, runningtitle, author, surname, section, page], default: none, status: impl}
  header_footer.footer.center: {type: enum, values: [none, title, runningtitle, author, surname, section, page], default: none, status: impl}
  header_footer.footer.right:  {type: enum, values: [none, title, runningtitle, author, surname, section, page], default: page, status: impl}
  header_footer.footer.rule:   {type: bool, default: true, status: impl}
  header_footer.page_number.format: {type: enum, values: [arabic, roman], default: arabic, status: new}
  header_footer.first_page:    {type: enum, values: [plain, none, header], default: plain, status: impl,
                                doc: "plain: LaTeX default (footer folio, no running head on page 1). none: nothing. header: carry the running head onto page 1 too."}

  # -- links and citations ---------------------------------------------------
  links.color:     {type: role, default: accent, status: impl}
  links.underline: {type: bool, default: false, status: new}
  citations.link:  {type: bool, default: true, status: impl}

# ---------------------------------------------------------------------------
# Cross-token rules the validator enforces beyond per-key types.
# ---------------------------------------------------------------------------
rules:
  - id: indent-and-spacing
    severity: warning
    doc: "A style should separate paragraphs by indent OR by vertical space, not both."
    when: "paragraph.indent != none && paragraph.spacing != none"

  - id: dropcap-twocolumn
    severity: warning
    doc: "lettrine drop caps are unreliable in two-column bodies."
    when: "paragraph.drop_cap.lines && page.columns == 2"

  - id: span-columns-single
    severity: warning
    doc: "figure.span_columns has no effect in a single-column body."
    when: "figure.span_columns && page.columns == 1"

  - id: margins-override
    severity: warning
    doc: "page.margins overrides page.margin; setting both is redundant."
    when: "page.margins.* && page.margin"

  - id: bar-and-rule
    severity: warning
    doc: "A heading bar already carries its own edge; a rule on the same level reads as an error."
    when: "headings.<h>.bar.fill && headings.<h>.rule.position != none"
