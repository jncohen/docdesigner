# docdesigner style — methods
# The modern computational / methods-journal look (JSS · R Journal · JOSS
# tradition): a clean transitional-serif body (Source Serif 4), a restrained
# teal accent used only on section heads, rules, and code labels, and — the
# signature move — code shown clearly in a tinted, bordered, line-numbered
# listing on a light syntax theme. Single column so long code lines never wrap.
#
# Rebuilt 2026-07-18 from the new token-faithful model set
# (methods-{title,firstpage,page,stylesheet}.dc.html). Renders today on the
# core-bundled families only (Source Serif 4 + Fira Code) — no fonts to ship.
# FLAT dotted-key format (schema v2). Validates clean against schema.yml
# (0 errors). Fidelity notes: fidelity.md.

id: methods
label: Methods
description: >
  Built for computational and methods journals, with code shown clearly.
  Transitional serif body (Source Serif 4) with a Fira Code monospace for
  listings and technical furniture; restrained teal accent; single column.

# ---- page -----------------------------------------------------------------
# Stylesheet spec sheet declares "margin: normal — 1in"; the model paddings
# (sides a steady 96px = 1.0in) confirm it. Single column keeps code unwrapped.
page.papersize: letter
page.margin: normal
page.columns: 1

# ---- typography -----------------------------------------------------------
typography.body: Source Serif 4
typography.heading: Source Serif 4
typography.mono: Fira Code
typography.base_size: 10pt
typography.line_height: 1.3
typography.mono_scale: 0.88          # spec sheet: mono 0.88× (default 0.82)
typography.justification: justified  # body specimens are justified with hyphens
typography.microtype: true

# ---- colour (near-black + deep teal, grayscale-safe) ----------------------
color.text: "#16181C"                # near-black, slightly cool
color.accent: "#0F766E"              # deep teal — section heads, rules, labels, links
color.muted: "#667085"               # cool grey: byline, captions, notes
color.rule: "#D4D9DE"                # hairline running-head / dividers
color.code_bg: "#F4F6F8"             # tint behind listings — the "code shown clearly" move
color.background: "#E9F3F2"          # light teal tint — the boxed abstract panel
links.color: accent
links.underline: false               # links coloured, not underlined (hover only)

# ---- headings (numbered; teal sections, italic run-in subhead) ------------
headings.number_sections: true
# h1 = # numbered sections ("1 Introduction", "2 Data and methods"): teal, bold.
headings.h1.scale: 1.5               # 22px section head ÷ 14.5px body
headings.h1.weight: bold
headings.h1.color: accent
# h2 = ## numbered subsections ("1.1 Estimator"): same teal-bold treatment.
headings.h2.scale: 1.2
headings.h2.weight: bold
headings.h2.color: accent
# h3 = ### italic subhead ("Estimated thresholds"): near-black, italic, bold.
headings.h3.scale: 1.0               # 15px ÷ 14.5px body
headings.h3.weight: bold             # bundled Source Serif 4 ships Regular/Bold
headings.h3.style: italic
headings.h3.color: text

# ---- title (flush-left journal opener: title, subtitle, byline, abstract) --
title.layout: journal
title.align: left
title.scale: 2.4                     # spec sheet: scale 2.4
title.color: text                    # title is near-black (#16181C = color.text)
title.rule.position: below           # accent underline beneath the title block
title.rule.weight: medium            # 1.5px rule ≈ medium (1pt)
title.rule.color: accent
title.subtitle.style: italic         # "Measurement and theory alternatives", muted italic
title.byline.color: text             # author name in text ink (#1A1D21), not muted
title.date.show: true
title.abstract.label: Abstract
title.abstract.label_style: heading
title.abstract.box: true             # boxed abstract with a colored panel (Joe's ask)
title.abstract.background: background # light teal tint fill
title.abstract.label_align: right    # "ABSTRACT" right-justified in the box
title.abstract.label_case: upper     # all-caps
title.abstract.label_color: accent   # teal accent label
title.abstract.size: 0.9             # 13.3px abstract ÷ 14.5px body
title.abstract.show: true
title.keywords.show: true
title.keywords.label: Keywords

# ---- paragraphs (modern block style: spaced, no first-line indent) ---------
paragraph.indent: none
paragraph.spacing: sm                # spec sheet: sm — 0.5em

# ---- figures / tables ------------------------------------------------------
figure.caption.position: below       # FIGURE 1 caption sits below the image
figure.caption.color: muted
table.style: booktabs                # heavy top/bottom rules, single header rule
table.header.weight: bold
table.row_stretch: 1.15
table.caption.position: above        # TABLE 1 label above; source note below

# ---- code (the hero: tinted, bordered, line-numbered light listing) --------
code.highlight: tango                # clean light theme, legible on code_bg
code.background: code_bg             # role -> the #F4F6F8 tint
code.border: true
code.line_numbers: true

# ---- quotes / methodological notes -----------------------------------------
quote.style: italic                  # "Note. …" set italic
quote.color: muted
quote.rule: true                     # left teal accent rule
quote.indent: md                     # ~16px inset from the rule

# ---- running head + folio --------------------------------------------------
# Continuation pages carry a hairline running head (author · running title on
# the left, section on the right); the folio sits centred in the foot. Page 1
# stays plain (its journal-furniture band is not expressible — see fidelity).
header_footer.header.left: surname   # renders the FULL author name today (no name-parsing)
header_footer.header.right: section
header_footer.header.rule: true
header_footer.footer.center: page    # centred folio, matching the body page
header_footer.footer.right: none     # avoid the default right-folio duplicate
header_footer.footer.rule: false
