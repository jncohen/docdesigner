id: minimal
label: Minimal
description: >
  The look of an unstyled R Markdown PDF: LaTeX's own Latin Modern, 1in
  margins, a centred title, bold unnumbered section heads, black ink
  throughout. The default style, and the plainest starting point for a new
  one.

# Page: rmarkdown's pdf_document default.
page.papersize: letter
page.margin: normal                  # 1in all round
page.columns: 1

# Type: LaTeX's article class at 10pt.
typography.body: Latin Modern
typography.heading: Latin Modern
typography.mono: Latin Modern Mono
typography.mono_scale: 1.0
typography.base_size: "10pt"
typography.line_height: 1.0
typography.justification: justified
typography.microtype: false

# Ink: black throughout.
color.text:   "#000000"
color.accent: "#000000"
color.muted:  "#000000"
color.rule:   "#000000"
links.color: text

# Headings: article's \Large / \large / \normalsize, bold, unnumbered
# (pdf_document's default is number_sections: false).
headings.number_sections: false
headings.h1.scale: 1.44
headings.h1.weight: bold
headings.h1.color: text
headings.h2.scale: 1.2
headings.h2.weight: bold
headings.h2.color: text
headings.h3.scale: 1.0
headings.h3.weight: bold
headings.h3.color: text
headings.h4.scale: 1.0
headings.h4.weight: bold
headings.h4.color: text

# Title block: article's centred \LARGE title, not bold; \large byline and date.
title.layout: header
title.align: center
title.scale: 1.728
title.weight: regular
title.color: text
title.subtitle.style: normal
title.subtitle.scale: 1.44
title.subtitle.color: text
title.byline.color: text
title.date.show: true
title.date.color: text
title.abstract.label: Abstract
title.abstract.label_style: heading  # centred bold label over the block
title.abstract.indent: lg
title.abstract.size: 0.9             # article's \small
title.keywords.show: false

# Body: indented paragraphs, no space between them.
paragraph.indent: lg                 # 15pt at 10pt
paragraph.spacing: none

# Floats and furniture.
figure.caption.position: below
figure.caption.size: 1.0
figure.caption.color: text
figure.caption.label_style: plain    # "Figure 1:"
table.style: booktabs
table.size: 1.0
table.row_stretch: 1.0
table.header.weight: regular
table.caption.position: above
footnotes.size: 0.8
code.highlight: tango

# A centred folio at the foot, none on page 1.
header_footer.footer.center: page
header_footer.footer.right: none
header_footer.footer.rule: false
header_footer.footer.color: text
header_footer.first_page: none
