# docdesigner style — sociology
# The structured, authoritative ASA-tradition look (American Sociological
# Review / American Journal of Social Research family): a single wide-measure
# column of Times-family serif, a strict three-level heading hierarchy
# (centred bold caps -> flush-left bold italic -> run-in bold italic with a
# trailing period), a small-caps run-in labelled abstract, ASA table
# conventions (title above, notes below), hanging-indent references, and a
# near-monochrome palette.
#
# Rebuilt 2026-07-18 from the token-faithful model set
# (the sociology design models). Original Times
# substituted with XITS (bundled Times-metrics serif). FLAT dotted-key format
# (schema v2). Validates clean against schema.yml (0 errors). Fidelity: fidelity.md.

id: sociology
label: Sociology
description: >
  A modern ASA-tradition journal look. A flush-left title under a sans
  "Research Article" kicker with a burgundy rule, Source Serif 4 text, burgundy
  capital section heads under a hairline, bold-italic subheads, a small-caps
  run-in abstract, and ASA table conventions.

# ---- page (asymmetric margins measured from the models) --------------------
# firstpage padding 92/108/84 px; body 84/108/84; title 128/108/84 (px/96 = in).
# Sides symmetric at 108px = 1.125in; opener top 92px = 0.958in.
page.papersize: letter
page.margins.top: 1                    # round 2
page.margins.bottom: 1.1               # round 2
page.margins.inner: 1.95   # measure: ~70 chars/line
page.margins.outer: 1.95   # measure: ~70 chars/line
page.columns: 1

# ---- typography (Times-metrics XITS, loose ASA leading) -------------------
typography.body: Source Serif 4        # round 2
typography.heading: Source Serif 4     # round 2
typography.mono: Fira Code
typography.base_size: "10.5pt"         # round 2
typography.line_height: 1.45           # round 2
typography.justification: justified
typography.microtype: true
typography.label: Arial                # round 2

# ---- colour (essentially monochrome; accent = links/rules only) -----------
color.text: "#1C1A19"                  # round 2
color.accent: "#7A2232"                # round 2
color.muted: "#5E5A58"                 # round 2
color.rule: "#C9C2C0"                  # round 2
links.color: accent

# ---- headings (three ASA levels) ------------------------------------------
headings.number_sections: false
headings.run_in: [h3]                  # h3 typeset run-in with the paragraph
# h1 = # Level-1 heads ("INTRODUCTION", "Results", "References"):
#      centred, bold, ALL CAPS, near-black.
headings.h1.scale: 0.95                # round 2
headings.h1.weight: bold
headings.h1.align: left                # round 2
headings.h1.case: upper
headings.h1.color: accent              # round 2
# h2 = ## Level-2 heads ("The Threshold Hypothesis", "Discussion"):
#      flush-left, bold italic, near-black.
headings.h2.scale: 1.0
headings.h2.weight: bold
headings.h2.style: italic
headings.h2.align: left
headings.h2.color: text
# h3 = ### Level-3 run-in lead-in ("Data and sample. text follows…"):
#      bold italic, trailing period, run-in with the paragraph.
headings.h3.scale: 1.0
headings.h3.weight: bold
headings.h3.style: italic
headings.h3.color: text
headings.h4.color: text                # else falls through to the accent default
headings.h1.rule.position: above       # round 2
headings.h1.rule.weight: hairline      # round 2
headings.h1.rule.color: rule           # round 2

# ---- title (centred caps head, centred small-caps byline, run-in abstract) -
title.layout: journal
title.align: left                      # round 2
title.scale: 2                         # round 2
title.byline.color: text               # byline in text ink, not muted
title.abstract.label_style: runin      # small-caps ABSTRACT run in with line 1
title.abstract.size: 0.92              # round 2
title.rule.position: below             # round 2
title.rule.weight: thick               # round 2
title.rule.color: accent               # round 2
title.kicker.text: "Research Article"  # round 2
title.kicker.font: label               # round 2
title.kicker.case: upper               # round 2
title.kicker.scale: 0.75               # round 2
title.kicker.color: accent             # round 2
title.subtitle.style: normal           # round 2
title.subtitle.scale: 1.15             # round 2
title.abstract.rule: true              # round 2
title.keywords.show: true              # round 2

# ---- paragraphs (traditional first-line indent, no extra spacing) ----------
paragraph.indent: md                   # round 2
paragraph.spacing: none

# ---- figures / tables (ASA conventions) -----------------------------------
figure.caption.position: above         # ASA figure titles sit above
figure.caption.color: muted            # round 2
table.style: booktabs                  # rules-only: top/mid/bottom, no verticals
table.header.weight: regular           # ASA column heads are not bold
table.row_stretch: 1.1
table.caption.position: above          # table titles above (notes below: content)

# ---- quotes / code ---------------------------------------------------------
quote.style: normal                    # block quotations indented, not italicised
quote.indent: md
code.highlight: none

# ---- running head + folio --------------------------------------------------
# Opener/continuation running head: journal-title (outer-left) · page (outer-
# right). Folio lives in the head; suppress the default footer folio.
header_footer.header.left: runningtitle
header_footer.header.right: page
header_footer.header.rule: true        # round 2
header_footer.first_page: plain        # round 2
header_footer.footer.center: none
header_footer.footer.right: none
header_footer.footer.rule: false
