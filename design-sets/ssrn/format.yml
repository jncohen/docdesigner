# docdesigner style — ssrn
# The austere, colourless look of an economics working paper in the NBER /
# SSRN tradition: a plain centred title page carrying the working-paper series
# line and number, centred authors and affiliation, a centred "Abstract"
# heading over a justified block, JEL codes and keywords, and a first-page
# acknowledgment footnote below a short rule. Times-family type, wide margins,
# loose leading, numbered sections, and effectively no colour.
#
# Rebuilt 2026-07-18 from the token-faithful model set
# (the ssrn design models). Original Times substituted
# with XITS (bundled Times-metrics serif). FLAT dotted-key format (schema v2).
# Validates clean against schema.yml (0 errors). Fidelity notes: fidelity.md.

id: ssrn
label: SSRN
description: >
  A working paper in the NBER and SSRN tradition: a centred title, numbered
  sections, spaced paragraphs and no colour.

# ---- page (asymmetric margins measured from the models) --------------------
# body page padding 96/128/84 px; title 108/128/84; firstpage 92/128/84
# (px / 96 = inches). Sides 128px = 1.333in ~= scales.margin.wide (1.35in).
# Sides capped at 1.25in (house rule: no margin wider than 1.25in).
page.papersize: letter
page.margins.top: 1.0
page.margins.bottom: 1                 # round 2
page.margins.inner: 1.25               # house cap: no margin over 1.25in
page.margins.outer: 1.25               # house cap: no margin over 1.25in
page.columns: 1

# ---- typography (Times-metrics XITS, large and loose) ----------------------
typography.body: XITS
typography.heading: XITS
typography.mono: Fira Code          # the abstract URL / handle only
typography.base_size: 12pt          # working papers run large and loose
typography.line_height: 1.3            # 2026-10 design review
typography.justification: justified
typography.microtype: true

# ---- colour (effectively none; accent = links only) -----------------------
color.text: "#000000"                  # round 2
color.accent: "#000000"                # round 2
color.muted: "#4A4A4A"                 # round 2
color.rule: "#000000"                  # round 2
links.color: accent

# ---- headings (plain bold, numbered, near-black not accent) ----------------
headings.number_sections: true
# h1 = # sections ("1  Introduction"): bold near-black, modest step above body.
headings.h1.scale: 1.15                # round 2
headings.h1.weight: bold
headings.h1.color: text
# h2 = ## subsections ("2  Framework"): bold near-black.
headings.h2.scale: 1.0
headings.h2.weight: bold
headings.h2.color: text
# h3 = ### run-in italic lead-in ("Identification. text follows…").
headings.h3.scale: 1.0
headings.h3.weight: regular            # round 2
headings.h3.style: italic              # round 2
headings.h3.color: text
headings.h4.color: text             # else falls through to the accent default

# ---- title — targets the compact LEFT opener (ssrn-firstpage model) ---------
# Flush-left title, run-in abstract, body on the same page. The models ALSO
# ship a centred standalone title page (ssrn-title); `title.layout: page`
# renders one, or pdf(title_layout = "page") per document.
title.layout: header
title.align: center                    # round 2
title.scale: 1.6                       # round 2
title.byline.color: text            # author name in text ink, not muted
title.date.show: true               # "This draft: June 23, 2026"
# Inline italic "Abstract." run in with the first line (opener), not a heading.
title.abstract.label_style: heading    # round 2
title.abstract.indent: md              # round 2
title.abstract.size: 0.95              # round 2
title.keywords.show: true           # "Keywords:" line under the abstract
title.kicker.text: "Working Paper"     # round 2
title.kicker.font: body                # round 2
title.kicker.case: none                # round 2
title.kicker.scale: 0.9                # round 2
title.kicker.color: text               # round 2
title.abstract.label_align: center     # round 2

# ---- paragraphs (traditional first-line indent, no extra spacing) ----------
paragraph.indent: none                 # round 2
paragraph.spacing: sm                  # round 2

# ---- figures / tables ------------------------------------------------------
table.style: booktabs
table.header.weight: bold

# ---- code / running foot ---------------------------------------------------
code.highlight: none                # working papers set code plain
# Folio centred in the footer, no rule; suppress the default right-slot folio.
header_footer.footer.center: page
header_footer.footer.right: none
header_footer.footer.rule: false

# ---- callout (::: callout div) -------------------------------------------
callout.style: boxed
callout.color: rule
callout.rule: hairline
callout.tint: 0
callout.title.color: text
callout.title.case: none
quote.rule: true                       # 2026-10 review
quote.style: italic                    # 2026-10 review
quote.indent: lg                       # 2026-10 review
