# docdesigner style -- review
# A working draft, printed to be read and marked up by hand: a structural pass
# (does the argument hold together?) and a line pass (is each sentence right?)
# on the same page. Not a publication look. Every choice serves reading
# slowly, writing on the page, and finding each mark again in the source.
#
#   * A 3in right margin, on every page, is the workspace; insertions are
#     written there and in the space between paragraphs. Paragraphs are separated by space, not
#     indent, for the same reason.
#   * Short measure (about 55 characters), generous leading, ragged right, no
#     hyphenation: slower reading, stable line breaks, and every hyphen on the
#     page is in the text.
#   * Line numbers (every 5th, right margin, per page) and paragraph numbers
#     (left margin, continuous) let a mark on paper be found in the source,
#     and a coauthor's note on paragraph 14 find paragraph 14 in the next version.
#   * The headings map the argument: the body opens with a table of every
#     claim, its words and its page; the running head names the section's
#     claim on every page; a heading that is a label rather than a claim is
#     flagged [[LABEL?]].
#   * [[TODO]], [[CITE]], [[WEAK]], [[CUT]], [[CHECK]], [[FIX]] print as
#     margin tags; citation keys print after citations; changebars mark
#     paragraphs changed since the last git tag; nothing floats.
#   * Every page carries the title, version (git hash) and date.
#
# The reasoning and its sources: the review style spec. Over the 1.25in margin
# cap by design; designer_validate_style() exempts a markup style's outer
# margin.

id: review
label: Review
description: >
  For drafts printed to read and mark up by hand: a 3in writing margin, line
  and paragraph numbers, a map of the argument, margin flags and changebars.

# ---- page -----------------------------------------------------------------
page.papersize: letter
page.twoside: false             # the wide margin is always on the right
page.margins.top: 1.0
page.margins.bottom: 1.0
page.margins.inner: 1.25        # left
page.margins.outer: 3.0         # right: the writing margin
page.columns: 1

# ---- typography -----------------------------------------------------------
typography.body: Source Serif 4
typography.heading: TeX Gyre Heros
typography.label: TeX Gyre Heros
typography.mono: Fira Code
typography.base_size: "11pt"
typography.line_height: 1.4
typography.justification: ragged-right
typography.hyphenation: false
typography.microtype: true

# ---- colour: near-black, one dark teal for everything the style adds -------
color.text: "#141413"
color.accent: "#0B5B6B"
color.muted: "#6B6B66"
color.rule: "#141413"

# ---- headings: numbered waypoints, modest scale, no page breaks -------------
headings.number_sections: true
headings.h1.scale: 1.25
headings.h1.color: text
headings.h1.space_before: lg
headings.h1.space_after: sm
headings.h2.scale: 1.08
headings.h2.color: text
headings.h3.scale: 1.0
headings.h3.style: italic
headings.h3.color: text

# ---- paragraphs: space between, room to write -----------------------------
paragraph.indent: none
paragraph.spacing: md

# ---- title ----------------------------------------------------------------
title.layout: header
title.scale: 1.9
title.rule.position: below
title.rule.weight: medium
title.warning.auto: true

# ---- running heads: section claim and folio right, stamp left -------------
header_footer.section_chars: 60
header_footer.header.right: section
header_footer.header.rule: true
header_footer.footer.left: stamp
header_footer.footer.right: folio
header_footer.footer.rule: false
header_footer.first_page: folio

# ---- tables, figures, notes -----------------------------------------------
table.style: booktabs
table.size: 0.9
figure.caption.position: below
footnotes.size: 0.86

# ---- markup ---------------------------------------------------------------
markup.line_numbers: 5
markup.paragraph_numbers: true
markup.flags: true
markup.cite_keys: true
markup.map: 2
markup.claim_check: true
markup.changebars: true
markup.floats: false

code.highlight: tango
